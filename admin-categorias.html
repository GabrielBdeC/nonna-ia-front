<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Categorias - Cantina da Nonna</title>
    <!-- Bootstrap v5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="public/styles/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍝 Cantina da Nonna</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Sair do Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sub Nav Admin -->
    <div class="bg-white border-bottom shadow-sm mb-4">
        <div class="container">
            <ul class="nav nav-pills py-3">
                <li class="nav-item">
                    <a class="nav-link text-dark" href="admin-pedidos.html">Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="admin-produtos.html">Produtos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active bg-danger" aria-current="page" href="admin-categorias.html">Categorias</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="container flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Gestão de Categorias</h2>
            <button class="btn btn-primary-custom" onclick="abrirModalCategoria()">
                + Nova Categoria
            </button>
        </div>

        <div id="alert-container"></div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nome da Categoria</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="categorias-tbody">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Categoria -->
    <div class="modal fade" id="categoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="categoriaForm">
                        <input type="hidden" id="categoria-id">
                        <div class="mb-3">
                            <label for="nomeCategoria" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nomeCategoria" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarCategoria">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cantina da Nonna. Área Administrativa.</p>
        </div>
    </footer>

    <!-- Bootstrap v5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Integration -->
    <script src="public/scripts/api.js"></script>
    <script src="public/scripts/admin-categorias.js"></script>
</body>
</html>
