<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Cantina da Nonna</title>
    <!-- Bootstrap v5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="public/styles/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍝 Cantina da Nonna</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cardapio.html">Cardápio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="reservas.html">Reservas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-pedidos.html">Área Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header da Página -->
    <div class="bg-dark text-light py-5 text-center">
        <div class="container">
            <h1 class="fw-bold">Reservar uma Mesa</h1>
            <p class="lead">Garanta seu lugar e viva uma experiência italiana inesquecível.</p>
        </div>
    </div>

    <!-- Formulário de Reserva -->
    <div class="container mt-5 mb-5 flex-grow-1" style="max-width: 600px;">
        
        <!-- Alerta para mensagens -->
        <div id="alert-container"></div>

        <div class="card card-custom p-4">
            <div class="card-body">
                <form id="reservaForm">
                    <div class="mb-3">
                        <label for="clienteId" class="form-label fw-bold">ID do Cliente</label>
                        <input type="text" class="form-control" id="clienteId" required placeholder="Digite seu ID (ex: 1)">
                        <div class="form-text">Para facilitar (simulando usuário logado).</div>
                    </div>

                    <div class="mb-3">
                        <label for="dataReserva" class="form-label fw-bold">Data da Reserva</label>
                        <input type="date" class="form-control" id="dataReserva" required>
                    </div>

                    <div class="mb-3">
                        <label for="horaReserva" class="form-label fw-bold">Hora</label>
                        <input type="time" class="form-control" id="horaReserva" required>
                    </div>

                    <div class="mb-3">
                        <label for="quantidadePessoas" class="form-label fw-bold">Quantidade de Pessoas</label>
                        <input type="number" class="form-control" id="quantidadePessoas" min="1" max="20" required placeholder="Ex: 4">
                    </div>

                    <div class="mb-4">
                        <label for="tipoEvento" class="form-label fw-bold">Tipo de Evento (Opcional)</label>
                        <select class="form-select" id="tipoEvento">
                            <option value="">Jantar Comum</option>
                            <option value="ANIVERSARIO">Aniversário</option>
                            <option value="CASAMENTO">Casamento</option>
                            <option value="CONFRATERNIZACAO">Confraternização</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-custom btn-lg" id="btnReservar">
                            Confirmar Reserva
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cantina da Nonna. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap v5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Integration -->
    <script src="public/scripts/api.js"></script>
    <script src="public/scripts/reservas.js"></script>
</body>
</html>
