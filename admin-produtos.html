<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Produtos - Cantina da Nonna</title>
    <!-- Bootstrap v5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="public/styles/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍝 Cantina da Nonna</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Sair do Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sub Nav Admin -->
    <div class="bg-white border-bottom shadow-sm mb-4">
        <div class="container">
            <ul class="nav nav-pills py-3">
                <li class="nav-item">
                    <a class="nav-link text-dark" href="admin-pedidos.html">Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active bg-danger" aria-current="page" href="admin-produtos.html">Produtos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="admin-categorias.html">Categorias</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="container flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Gestão de Produtos</h2>
            <button class="btn btn-primary-custom" onclick="abrirModalProduto()">
                + Novo Produto
            </button>
        </div>

        <div id="alert-container"></div>

        <div class="row" id="produtos-grid">
            <!-- Produtos renderizados aqui via JS -->
            <div class="col-12 text-center py-4">
                <div class="spinner-border text-danger" role="status"></div>
            </div>
        </div>
    </div>

    <!-- Modal Produto -->
    <div class="modal fade" id="produtoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalTitle">Novo Produto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="produtoForm">
                        <input type="hidden" id="produto-id">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="nome" class="form-label">Nome do Produto</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="preco" class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="preco" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" rows="2"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="idCategoria" class="form-label">Categoria</label>
                                <select class="form-select" id="idCategoria" required>
                                    <option value="">Carregando categorias...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="imagem" class="form-label">URL da Imagem</label>
                                <input type="url" class="form-control" id="imagem" placeholder="https://exemplo.com/img.jpg">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarProduto">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cantina da Nonna. Área Administrativa.</p>
        </div>
    </footer>

    <!-- Bootstrap v5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Integration -->
    <script src="public/scripts/api.js"></script>
    <script src="public/scripts/admin-produtos.js"></script>
</body>
</html>
